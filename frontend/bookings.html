<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My Bookings — CoffeeBlend</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Great+Vibes" rel="stylesheet">
    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
      body { background: #111; color: #fff; font-family: 'Poppins', sans-serif; }

      .cb-page-hero {
        background: linear-gradient(135deg, #1a1a1a 0%, #2a1f0e 100%);
        padding: 120px 0 60px; text-align: center;
        border-bottom: 2px solid #c49b63;
      }
      .cb-page-hero h1 { color: #c49b63; font-size: 2.2rem; font-weight: 700; margin-bottom: 6px; }
      .cb-page-hero p  { color: #aaa; font-size: 0.95rem; }

      .cb-section { padding: 50px 0 70px; }

      .cb-booking-card {
        background: #1a1a1a; border: 1px solid #2a2a2a;
        border-radius: 14px; padding: 24px 26px; margin-bottom: 20px;
        transition: border-color 0.2s;
      }
      .cb-booking-card:hover { border-color: #c49b63; }

      .cb-booking-head {
        display: flex; justify-content: space-between;
        align-items: flex-start; flex-wrap: wrap; gap: 10px;
        margin-bottom: 16px; padding-bottom: 14px;
        border-bottom: 1px solid #2a2a2a;
      }
      .cb-booking-name { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 2px; }
      .cb-booking-date { font-size: 0.82rem; color: #888; }

      .cb-booking-details { display: flex; flex-wrap: wrap; gap: 20px; }
      .cb-detail-item { display: flex; align-items: center; gap: 8px; }
      .cb-detail-icon { color: #c49b63; font-size: 1rem; }
      .cb-detail-label { font-size: 0.75rem; color: #666; }
      .cb-detail-val   { font-size: 0.9rem; color: #ccc; font-weight: 500; }

      .cb-badge {
        display: inline-block; padding: 4px 14px;
        border-radius: 20px; font-size: 0.72rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.5px;
      }
      .cb-badge-pending   { background: rgba(249,109,0,0.15);  color: #f96d00; border: 1px solid rgba(249,109,0,0.3); }
      .cb-badge-confirmed { background: rgba(25,135,84,0.15);  color: #75b798; border: 1px solid rgba(25,135,84,0.3); }
      .cb-badge-cancelled { background: rgba(220,53,69,0.15);  color: #ea868f; border: 1px solid rgba(220,53,69,0.3); }

      .cb-empty { text-align:center; padding: 80px 20px; }
      .cb-empty-icon { font-size: 3.5rem; margin-bottom: 16px; }
      .cb-empty h4 { color: #888; font-size: 1.1rem; margin-bottom: 10px; }
      .cb-empty p  { color: #555; font-size: 0.85rem; margin-bottom: 24px; }
      .cb-btn-gold {
        background: #c49b63; color: #fff; border: none;
        padding: 12px 30px; border-radius: 6px; font-family: 'Poppins',sans-serif;
        font-weight: 600; font-size: 0.9rem; cursor: pointer; text-decoration: none;
        display: inline-block; transition: background 0.2s;
      }
      .cb-btn-gold:hover { background: #b08850; color: #fff; text-decoration: none; }

      .cb-loading { text-align:center; padding: 80px 0; color: #666; }
      .cb-spinner {
        width: 36px; height: 36px; border: 3px solid #2e2e2e;
        border-top-color: #c49b63; border-radius: 50%;
        animation: cbSpin 0.7s linear infinite; margin: 0 auto 14px;
      }
      @keyframes cbSpin { to { transform: rotate(360deg); } }

      .cb-count-badge {
        background: #c49b63; color: #fff; border-radius: 20px;
        font-size: 0.78rem; padding: 2px 10px; margin-left: 8px; font-weight: 600;
      }
      .cb-new-booking-btn {
        display: inline-block; margin-bottom: 28px;
        background: transparent; border: 1px solid #c49b63; color: #c49b63;
        padding: 10px 24px; border-radius: 6px; font-family: 'Poppins',sans-serif;
        font-size: 0.88rem; text-decoration: none; transition: all 0.2s;
      }
      .cb-new-booking-btn:hover { background: #c49b63; color: #fff; text-decoration: none; }

      /* Dropdown */
      .cb-user-dropdown-menu {
        background: #1a1a1a; border: none; border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.35); min-width: 180px; margin-top: 6px;
      }
      .cb-user-dropdown-menu .dropdown-item { color: #e0e0e0; padding: 10px 18px; font-size: 0.93em; transition: background 0.15s; }
      .cb-user-dropdown-menu .dropdown-item:hover { background: #c49b63; color: #fff; }
      .cb-user-dropdown-menu .dropdown-divider { border-color: #333; }
      #nav-user-dropdown .cb-user-toggle { display:flex; align-items:center; gap:5px; cursor:pointer; }
      @media(max-width:991px){
        .cb-user-dropdown-menu { background:transparent; box-shadow:none; border-radius:0; padding-left:12px; }
        .cb-user-dropdown-menu .dropdown-item { color:rgba(255,255,255,0.8); }
        .cb-user-dropdown-menu .dropdown-item:hover { background:rgba(196,155,99,0.15); color:#c49b63; }
      }
    </style>
  </head>
  <body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">Coffee<small>Blend</small></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="oi oi-menu"></span> Menu
        </button>
        <div class="collapse navbar-collapse" id="ftco-nav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
            <li class="nav-item"><a href="services.html" class="nav-link">Services</a></li>
            <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
            <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
            <li class="nav-item cart"><a href="cart.html" class="nav-link"><span class="icon icon-shopping_cart"></span></a></li>
            <li class="nav-item" id="nav-login-item"><a href="login.html" class="nav-link" id="nav-login-link">Login</a></li>
            <li class="nav-item" id="nav-register-item"><a href="register.html" class="nav-link" id="nav-register-link">Register</a></li>
            <li class="nav-item dropdown" id="nav-user-dropdown" style="display:none;">
              <a href="#" class="nav-link dropdown-toggle cb-user-toggle" id="cb-user-menu" role="button" aria-expanded="false">
                <span class="icon icon-person" style="font-size:1.2em;vertical-align:middle;"></span>
                <span id="cb-username-display" style="margin-left:4px;vertical-align:middle;font-size:0.97em;"></span>
              </a>
              <div class="dropdown-menu dropdown-menu-right cb-user-dropdown-menu" aria-labelledby="cb-user-menu">
                <a class="dropdown-item" href="profile.html"><span class="icon icon-person" style="margin-right:6px;"></span>My Profile</a>
                <a class="dropdown-item" href="orders.html"><span class="icon icon-list" style="margin-right:6px;"></span>My Orders</a>
                <a class="dropdown-item" href="bookings.html"><span class="icon icon-calendar" style="margin-right:6px;"></span>My Bookings</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item cb-logout-btn" href="#"><span class="icon icon-power-standby" style="margin-right:6px;"></span>Logout</a>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- HERO -->
    <div class="cb-page-hero">
      <h1>My Bookings <span class="cb-count-badge" id="cb-booking-count" style="display:none;">0</span></h1>
      <p>View and manage your table reservations</p>
    </div>

    <!-- CONTENT -->
    <section class="cb-section">
      <div class="container" style="max-width:760px;">

        <a href="services.html" class="cb-new-booking-btn">+ Book a New Table</a>

        <div id="cb-loading" class="cb-loading">
          <div class="cb-spinner"></div>
          <div>Loading your bookings...</div>
        </div>
        <div id="cb-bookings-container" style="display:none;"></div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="ftco-footer ftco-section img" style="background:#0d0d0d; padding: 60px 0 30px;">
      <div class="container">
        <div class="row">
          <div class="col-md-12 text-center">
            <p style="color:#666; font-size:0.85rem;">
              Copyright &copy;<script>document.write(new Date().getFullYear());</script> CoffeeBlend. All rights reserved.
            </p>
          </div>
        </div>
      </div>
    </footer>

    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/api.js"></script>
    <script>
    (function() {
      var BASE  = 'http://localhost:5000/api';
      var token = localStorage.getItem('cb_token');

      // AUTH GUARD
      if (!token) {
        alert('Please login to continue');
        window.location.href = 'login.html';
        return;
      }

      function cbUpdateNavbar() {
        var userRaw = localStorage.getItem('cb_user');
        var loginItem    = document.getElementById('nav-login-item');
        var registerItem = document.getElementById('nav-register-item');
        var userDropdown = document.getElementById('nav-user-dropdown');
        var usernameDisp = document.getElementById('cb-username-display');
        if (token && userRaw) {
          try { var u = JSON.parse(userRaw); if (usernameDisp) usernameDisp.textContent = u.name || u.username || 'User'; } catch(e) {}
          if (loginItem)    loginItem.style.display    = 'none';
          if (registerItem) registerItem.style.display = 'none';
          if (userDropdown) userDropdown.style.display = '';
        }
      }

      function cbInitDropdown() {
        var toggle = document.getElementById('cb-user-menu');
        var menu   = document.querySelector('.cb-user-dropdown-menu');
        if (!toggle || !menu) return;
        toggle.addEventListener('click', function(e) {
          e.preventDefault(); e.stopPropagation();
          var open = menu.classList.contains('show');
          menu.classList.toggle('show', !open);
          toggle.setAttribute('aria-expanded', !open);
        });
        document.addEventListener('click', function(e) {
          if (!toggle.contains(e.target) && !menu.contains(e.target)) menu.classList.remove('show');
        });
        document.addEventListener('keydown', function(e) { if (e.key==='Escape') menu.classList.remove('show'); });
        document.querySelectorAll('.cb-logout-btn').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('cb_token'); localStorage.removeItem('cb_user'); localStorage.removeItem('cb_cart');
            window.location.href = 'index.html';
          });
        });
      }

      function statusBadge(s) {
        var map = { pending:'cb-badge-pending', confirmed:'cb-badge-confirmed', cancelled:'cb-badge-cancelled' };
        return '<span class="cb-badge ' + (map[s]||'cb-badge-pending') + '">' + (s||'pending') + '</span>';
      }

      function fmtDate(d) {
        return new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
      }

      function loadBookings() {
        fetch(BASE + '/bookings/my-bookings', { headers: { 'Authorization': 'Bearer ' + token } })
          .then(function(r){ return r.json(); })
          .then(function(res) {
            document.getElementById('cb-loading').style.display = 'none';
            var container = document.getElementById('cb-bookings-container');
            container.style.display = '';

            var bookings = (res.success && res.bookings) ? res.bookings : [];

            if (bookings.length === 0) {
              container.innerHTML = '<div class="cb-empty">'
                + '<div class="cb-empty-icon">📅</div>'
                + '<h4>No bookings yet</h4>'
                + '<p>You haven\'t booked a table yet. Reserve your spot today!</p>'
                + '<a href="services.html" class="cb-btn-gold">Book a Table ☕</a>'
                + '</div>';
              return;
            }

            var countBadge = document.getElementById('cb-booking-count');
            countBadge.textContent = bookings.length;
            countBadge.style.display = '';

            var html = '';
            bookings.forEach(function(b) {
              html += '<div class="cb-booking-card">'
                + '<div class="cb-booking-head">'
                  + '<div>'
                    + '<div class="cb-booking-name">' + (b.firstName||'') + ' ' + (b.lastName||'') + '</div>'
                    + '<div class="cb-booking-date">Booked on ' + fmtDate(b.createdAt) + '</div>'
                  + '</div>'
                  + statusBadge(b.status)
                + '</div>'
                + '<div class="cb-booking-details">'
                  + '<div class="cb-detail-item">'
                    + '<span class="cb-detail-icon"><span class="icon icon-calendar"></span></span>'
                    + '<div><div class="cb-detail-label">Date</div><div class="cb-detail-val">' + (b.date||'—') + '</div></div>'
                  + '</div>'
                  + '<div class="cb-detail-item">'
                    + '<span class="cb-detail-icon"><span class="icon icon-clock"></span></span>'
                    + '<div><div class="cb-detail-label">Time</div><div class="cb-detail-val">' + (b.time||'—') + '</div></div>'
                  + '</div>'
                  + '<div class="cb-detail-item">'
                    + '<span class="cb-detail-icon"><span class="icon icon-people"></span></span>'
                    + '<div><div class="cb-detail-label">Guests</div><div class="cb-detail-val">' + (b.guests||2) + ' people</div></div>'
                  + '</div>'
                  + '<div class="cb-detail-item">'
                    + '<span class="cb-detail-icon"><span class="icon icon-phone"></span></span>'
                    + '<div><div class="cb-detail-label">Phone</div><div class="cb-detail-val">' + (b.phone||'—') + '</div></div>'
                  + '</div>'
                + '</div>'
                + '</div>';
            });
            container.innerHTML = html;
          })
          .catch(function() {
            document.getElementById('cb-loading').style.display = 'none';
            document.getElementById('cb-bookings-container').style.display = '';
            document.getElementById('cb-bookings-container').innerHTML = '<div class="cb-empty"><h4>Could not load bookings</h4><p>Check your connection and try again.</p></div>';
          });
      }

      document.addEventListener('DOMContentLoaded', function() {
        cbUpdateNavbar();
        cbInitDropdown();
        loadBookings();
      });
    })();
    </script>
  </body>
</html>
